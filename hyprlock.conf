source = ~/.config/Brain_Shell/matugen/colors.conf
source = ~/.config/hypr/sizes-hyprlock.conf		# NECESSARY for positioning and getting sizes of all elements.
$script_path = ~/.config/hypr/scripts
$cache_path = ~/.cache/hyprlock-cache/style-1

$font = Kamikaze
$font_italic = Kamikaze Italic
$font_mono = Fira Code Nerd Font Mono

animations {
enabled = true

bezier = easeOutQuint,0.23,1,0.32,1.0
bezier = almostLinear,0.5,0.5,0.75,1.0
bezier = stopGo,0.5,0,1.0,0.5

animation = inputFieldDots, 1, 10.21, easeOutQuint
animation = fadeIn, 1, 6.21, almostLinear
animation = fadeOut, 1, 7.21, stopGo
animation = inputFieldColors, 1, 5, easeOutQuint
}

background {
monitor =
path = $HOME/.curr_wall_static.jpg
blur_passes = 3
blur_size = 3
}

# Top left panel
image {
size = $top_left_size
path = $cache_path/top_left_panel.png
rounding = 40
border_size = 0
halign = center
valign = center
position = $top_left_offset
zindex = 0
shadow_passes = 3
shadow_size = 5
shadow_boost = 0.6
}

# Password box
shape {
size = $container_box_size
color = rgb($secondary)
rounding = 40
halign = center
valign = center
position = $pw_box_offset
zindex = 1
shadow_passes = 2
shadow_size = 3
shadow_boost = 0.6
}

# Username box
shape {
size = $container_box_size
color = rgb($secondary)
rounding = 40
halign = center
valign = center
position = $un_box_offset
zindex = 1
shadow_passes = 2
shadow_size = 3
shadow_boost = 0.6
}

# Actual username (Centered in box)
label {
text = <span>$USER</span>
text_align = center
color = rgb($background)
font_size = $user_font
font_family = $font
position = $un_value_offset
halign = center
valign = center
zindex = 2
}

# Actual password field (Centered in box)
input-field {
monitor =
size = $input_field_size
outline_thickness = 0
dots_center = true
dots_size = 0.30
inner_color = rgba(0,0,0,0)
check_color = rgb($foreground)
fail_color = rgb($outline)
fail_text = Authentication Failed
font_family = $font
font_color = rgb($background)
swap_font_color = true
fade_on_empty = false
rounding = 0
placeholder_text = <i>Input Password...</i>
position = $input_field_offset
halign = center
valign = center
zindex = 2
}

# Log in text
label {
text = Log in
text_align = center
color = rgb($foreground)
font_size = $heading_font
font_family = $font
position = $login_text_offset
halign = center
valign = center
zindex = 2
}

# Hostname
label {
text = cmd[update:60000] cat /proc/sys/kernel/hostname
text_align = center
color = rgb($foreground)
font_size = $body_font
font_family = $font
position = $hostname_text_offset
halign = center
valign = center
zindex = 2
}

# Bottom left panel
image {
size = $bottom_left_size
path = $cache_path/bottom_left_panel.png
rounding = 40
border_size = 0
halign = center
valign = center
position = $bottom_left_offset
zindex = 0
shadow_passes = 3
shadow_size = 5
shadow_boost = 0.6
}

# Current time
label {
text = <span>$TIME</span>
text_align = center
color = rgb($foreground)
font_size = $huge_font
font_family = $font_italic
position = $time_text_offset
halign = center
valign = top
zindex = 1
}

# Uptime text
label {
text =  UPTIME
text_align = left
color = rgb($foreground)
font_size = $body_font
font_family = $font
position = $uptime_ltext_offset
halign = left
valign = bottom
zindex = 1
}

# Actual uptime
label {
text = cmd[update:60000] uptime -p | sed -E 's/^up //; s/[ ,]//g; s/days?/D /g; s/hours?/H /g; s/minutes?/M/g'
text_align = right
color = rgb($primary)
font_size = $body_font
font_family = $font_italic
position = $uptime_rtext_offset
halign = right
valign = bottom
zindex = 1
}

# Right panel
image {
size = $right_size
path = $cache_path/right_panel.png
rounding = 40
border_size = 0
halign = center
valign = center
position = $right_offset
zindex = 0
shadow_passes = 3
shadow_size = 5
shadow_boost = 0.6
}

# Profile picture (Squircle from wallpaper avatar crop)
image {
size = $image_size
path = $cache_path/avatar.png
border_size = 0
rounding = 30
halign = center
valign = center
position = $image_offset
zindex = 2
shadow_passes = 2
shadow_size = 3
shadow_boost = 0.6
}

# Media source symbol
label {
text = cmd[update:10000] $script_path/player -s
text_align = center
color = rgb($foreground)
font_size = $large_font
font_family = $font_mono
position = $media_symbol_offset
halign = center
valign = center
zindex = 3
}

# Media playing
label {
text = cmd[update:10000] $script_path/player -n
text_align = center
color = rgb($foreground)
font_size = $body_font
font_family = $font
position = $media_content_value_offset
halign = center
valign = center
zindex = 3
}

# Name of player/artist
label {
text = cmd[update:10000] $script_path/player -a
text_align = center
color = rgb($foreground)
font_size = $small_font
font_family = $font
position = $media_player_value_offset
halign = center
valign = center
zindex = 3
}

# Day of the week
label {
text = cmd[update:8640000] date +%a | sed 's/[a-z]/\U&/g'
text_align = center
color = rgb($foreground)
font_size = $heading_font
font_family = $font
position = $day_value_offset
halign = center
valign = center
zindex = 3
}

# Date
label {
text = cmd[update:8640000] date +"%d %B, %Y"
text_align = center
color = rgb($foreground)
font_size = $body_font
font_family = $font
position = $date_value_offset
halign = center
valign = center
zindex = 3
}

# -----------------------------------------------------
# POWER OPTIONS (Vertically & Horizontally Centered)
# -----------------------------------------------------

# Suspend Box
shape {
size = $power_btn_size
color = rgb($secondary)
rounding = 25
halign = center
valign = center
position = $power_suspend_offset
zindex = 2
shadow_passes = 2
shadow_size = 3
shadow_boost = 0.6
}

# Suspend Button
label {
monitor =
text = 󰤄
text_align = center
color = rgb($background)
font_size = 28
font_family = Symbols Nerd Font
onclick = systemctl suspend
position = $power_suspend_offset
halign = center
valign = center
zindex = 3
}

# Reboot Box
shape {
size = $power_btn_size
color = rgb($secondary)
rounding = 25
halign = center
valign = center
position = $power_reboot_offset
zindex = 2
shadow_passes = 2
shadow_size = 3
shadow_boost = 0.6
}

# Reboot Button
label {
monitor =
text = 󰜉
text_align = center
color = rgb($background)
font_size = 28
font_family = Symbols Nerd Font
onclick = reboot
position = $power_reboot_offset
halign = center
valign = center
zindex = 3
}

# Power Off Box
shape {
size = $power_btn_size
color = rgb($secondary)
rounding = 25
halign = center
valign = center
position = $power_shutdown_offset
zindex = 2
shadow_passes = 2
shadow_size = 3
shadow_boost = 0.6
}

# Power Off Button
label {
monitor =
text = 󰐥
text_align = center
color = rgb($background)
font_size = 28
font_family = Symbols Nerd Font
onclick = shutdown now
position = $power_shutdown_offset
halign = center
valign = center
zindex = 3
}
