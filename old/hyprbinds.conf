###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, $fileManager

bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod SHIFT, T, exec, $toggleLayout

bind = $mainMod, P, pseudo # dwindle
bind = $mainMod, Y, layoutmsg, togglesplit # dwindle
bind = $mainMod, RETURN, layoutmsg, swapsplit #dwindle

bind = $mainMod, RETURN, layoutmsg, swapwithmaster master #master
bind = $mainMod, I, layoutmsg, addmaster #master
bind = $mainMod, D, layoutmsg, removemaster #master

bind = $mainMod SHIFT, M, exec, $toggleMonocle
bind = $mainMod, J, layoutmsg, cycleprev #monocle
bind = $mainMod, K, layoutmsg, cyclenext #monocle

bind = $mainMod SHIFT, O, exec, $toggleScrolling
bind = $mainMod, period, layoutmsg, move +col #scrolling 
bind = $mainMod, comma, layoutmsg, move -col #scrolling 
bind = $mainMod SHIFT, period, layoutmsg, colresize +0.25 #scrolling 
bind = $mainMod SHIFT, comma, layoutmsg, colresize -0.25 #scrolling 
bind = $mainMod, H, layoutmsg, fit active #scrolling
bind = $mainMod, J, layoutmsg, fit visible #scrolling
bind = $mainMod, K, layoutmsg, fit tobeg #scrolling
bind = $mainMod SHIFT, K, layoutmsg, fit toend #scrolling
bind = $mainMod, L, layoutmsg, fit all #scrolling
bind = $mainMod, P, layoutmsg, promote
bind = $mainMod, RETURN, layoutmsg, swapcol r
bind = $mainMod SHIFT, RETURN, layoutmsg, swapcol l
bind = $mainMod SHIFT, P, layoutmsg, togglefit #scrolling
bind = $mainMod SHIFT, L, exec, $toggleDirection

bind = $mainMod, S, exec, $music
bind = $mainMod, F, exec, $brcmd
bind = $mainMod, Q, exec, $rofi
bindr = $mainMod, SUPER_L , exec, $dashboard
bind = $mainMod, X, exec, hyprlock
bind = , PRINT, exec, $ss

# Move focus with mainMod + HJKL
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [-1-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, TAB, workspace,previous

# Move active window to a workspace with mainMod + SHIFT + [-1-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod CTRL, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

bind = $mainMod CTRL, D, togglespecialworkspace, magic1
bind = $mainMod SHIFT, D, movetoworkspacesilent, special:magic1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+0
bind = $mainMod, mouse_up, workspace, e-2

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = SHIFT, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -n95 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -n95 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
