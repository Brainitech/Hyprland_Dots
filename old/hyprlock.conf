# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Kamikaze
$font1=Kamikaze Italic
$font2 = Kamikaze

source = colors.conf

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

@import 

background {
    monitor =
    path = $HOME/.curr_wall_static.jpg
    blur_passes = 3
}

input-field {
    monitor =
    size = 15%, 5%
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgb($outline)
    check_color = rgb($surface)
    fail_color =  rgb($tertiary)

    font_color = rgb($outline)
    fade_on_empty = false
    rounding = 5

    font_family = $font2
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.25
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0,-180
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:60000] date +%H
    font_size = 150
    font_family = $font1
    color = rgb($primary)
    position = -50, -180
    halign = center
    valign = top
}
label {
    monitor =
    text =cmd[update:60000] date +%M
    font_size = 150
    font_family = $font1
	color = rgb($primary)

    position = 50, -330
    halign = center
    valign = top
}
# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B" # update every 60 seconds
    font_size = 25
    font_family = $font
	color = rgb($primary)

    position = 0, -40
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = 󰜉
    color = rgb($secondary)
    font_size = 50
    onclick = reboot
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgb($secondary)
    font_size = 50
    onclick = shutdown now
    position = 820, 100
    halign =left 
    valign = bottom
}

# Suspend
label {
    monitor =
    text = 󰤄
    color = rgb($secondary)
    font_size = 50
    onclick = systemctl suspend
    position = -820, 100
    halign = right
    valign = bottom
}

