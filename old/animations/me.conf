animations {
    enabled = true
    # Animation curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = crazyout, 0.3, -0.4, 0.8, 0.92
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    

    # Animation configs
    animation = windowsMove, 1, 4, crazyshot, slide
    animation = windowsIn, 1, 4, crazyshot, gnomed
    animation = windowsOut, 1, 4, crazyshot, gnomed

    animation = layers, 1, 3, overshot, slide top

    #rofi animation
    #layerrule = animation popin 20%, rofi
    
    animation = workspaces, 1, 4, softAcDecel, slide
    animation = specialWorkspace,1, 4, crazyshot, slidefadevert
    animation = specialWorkspaceOut,1, 4, crazyout, slidefadevert
}
